<!DOCTYPE html>
<html>
<head>
    <title>Estudo de Classes em CSS</title>

    <style>
        .titulo{
            color:rgb(1, 59, 32);
            text-align: center; 
        }    
        
        .caixa01{
            background-color: rgb(216, 188, 210);
            border: 2px solid darkblue;
            padding:20px;
            margin: 20px;
        }

        .caixa02{
            background-color: rgb(229, 235, 198);
            border: 2px solid black;
            padding:20px;
            margin: 20px;
        }

          .caixa03{
            background-color: rgb(192, 210, 231);
            border: 2px solid black;
            padding:20px;
            margin: 20px;
        }

        .paragrafo1{
            color:rgb(99, 19, 19);
            font-weight: bold;
    
        }

        .paragrafo2{
            color:blueviolet;
            background-color: white;
            font-style: italic;
            padding:10px;
            border-radius: 10px;
            margin-right: 900px;
        }



    </style>

</head>

<body>
    <h1 class="titulo">Aprendendo Classes com CSS</h1>

    <div class="caixa01">
        <p class= "paragrafo1"> Este é o primeiro parágrafo da primeira div.</p>
        <p class= "paragrafo2">Este é o segundo parágrafo da primeira div.</p>
    </div>

    <div class="caixa02">
        <p class= "paragrafo">Este é o único parágrafo da segunda div.</p>
    </div>

        <div class="caixa03">
        <p class= "paragrafo">Este é o único parágrafo da terceira div.</p>
    </div>

</body>
</html>
