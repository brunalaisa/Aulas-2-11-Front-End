<!DOCTYPE html>
<html lang="en">
<head>

    <title>Exemplo de Classe e ID</title>

    <link rel="stylesheet" href="style01.css">

</head>
<body>
    <h1> Exemplo de Classe e Id</h1>

    <p> Parágrafo comum de página</p>

    <div> Esta é uma sem formatação.</div>

    <br>
     
    <div class="caixa" id="aviso">
        Esta div utiliza a classe caixa e o identificador aviso.
    </div>

    <br>

    <span> Este é um span sem formatação.</span>

    <br><br>

    <span class=".c21"> Este é um span utilizando a classe caixa</span>
    

</body>
