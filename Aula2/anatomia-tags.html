<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia das Tags HTML</title>
</head>
<body>
    <h1>Anatomia das Tags</h1>
    <p>
        As tags HTML são os elementos básicos
        que compõem uma página web. Cada tag
        tem uma estrutura específica que desempenha
        um papel importante na organazição e apresentação do conteúdo.

    </p>
    <p>
        Este é um exemplo de parágrafo que pode 
        conter:<br> <strong>Negrito com strong</strong> ou <br>
        texto em <em>Itálico com em </em>
    </p>
</body>
</html>
