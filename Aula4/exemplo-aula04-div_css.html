<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: de div,br e hr</title>
    
    <style>
        body{
            background-color: rgb(182, 182, 180);
        }
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;

        }
        #principal {
            background-color: rgb(72, 55, 168);
            border: 5px solid black;
            font-style: italic;
            color: white;
        }

        #secundaria {
            background-color: rgb(38, 99, 38);
            border: 5px solid black;
            font-style: oblique;
            color: white;           
        }
        
        hr{
            border: none;
            border-top: 3px solid grey;
            width: 90%;
        }






    </style>

</head>
<body>
    <div id = "principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id = secundaria>
        Esta é outra divisão da página. 
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
